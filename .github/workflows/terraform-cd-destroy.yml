name: CD - AWS DocumentDB (Destroy)

on:
  workflow_dispatch:
    inputs:

      vpc_cidr_block:
        description: CIDR block for the VPC
        required: true
        type: string
        default: 10.0.0.0/16

      cluster_identifier_prefix:
        description: Prefix for the DocumentDB cluster identifier
        required: true
        type: string
        default: my-docdb-cluster-

      instance_identifier_prefix:
        description: Prefix for the DocumentDB instance identifier
        required: true
        type: string
        default: my-docdb-instance-

      master_username:
        description: Master username for the DocumentDB cluster
        required: true
        type: string
        default: admin

      instance_class:
        description: Instance class for the DocumentDB instance
        required: true
        type: string
        default: db.r5.large

      backup_retention_period:
        description: Backup retention period in days
        required: true
        type: number
        default: 7

      allowed_cidr_blocks:
        description: 'CIDR blocks allowed to access DocumentDB (HCL list format e.g. ["10.0.0.0/8"])'
        required: true
        type: string
        default: '["0.0.0.0/0"]'

      environment:
        description: Environment tag value
        required: true
        type: string
        default: Production

env:
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
  TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
  TF_VAR_master_password: ${{ secrets.DOCDB_MASTER_PASSWORD }}

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.TF_STATE_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: latest
    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=documentdb/terraform.tfstate" \
          -backend-config="region=$TF_STATE_REGION" \
          -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" \
          -backend-config="encrypt=true"
    - name: Terraform Plan
      run: |
        terraform plan -destroy \
          -var="vpc_cidr_block=${{ github.event.inputs.vpc_cidr_block }}" \
          -var="cluster_identifier_prefix=${{ github.event.inputs.cluster_identifier_prefix }}" \
          -var="instance_identifier_prefix=${{ github.event.inputs.instance_identifier_prefix }}" \
          -var="master_username=${{ github.event.inputs.master_username }}" \
          -var="instance_class=${{ github.event.inputs.instance_class }}" \
          -var="backup_retention_period=${{ github.event.inputs.backup_retention_period }}" \
          -var="allowed_cidr_blocks=${{ github.event.inputs.allowed_cidr_blocks }}" \
          -var="environment=${{ github.event.inputs.environment }}"
    - name: Terraform Destroy
      run: |
        terraform destroy -auto-approve \
          -var="vpc_cidr_block=${{ github.event.inputs.vpc_cidr_block }}" \
          -var="cluster_identifier_prefix=${{ github.event.inputs.cluster_identifier_prefix }}" \
          -var="instance_identifier_prefix=${{ github.event.inputs.instance_identifier_prefix }}" \
          -var="master_username=${{ github.event.inputs.master_username }}" \
          -var="instance_class=${{ github.event.inputs.instance_class }}" \
          -var="backup_retention_period=${{ github.event.inputs.backup_retention_period }}" \
          -var="allowed_cidr_blocks=${{ github.event.inputs.allowed_cidr_blocks }}" \
          -var="environment=${{ github.event.inputs.environment }}"
